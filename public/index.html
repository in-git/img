<!DOCTYPE html>
<html lang="zh-CN" class="antialiased selection:bg-black selection:text-white">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>吴文龙的图片处理工具</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide 图标库 CDN -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <!-- JSZip & FileSaver -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <!-- React & ReactDOM 18.2 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Babel 在线解析 JSX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <style>
    /* SF Pro / PingFang 苹果原生字体栈 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      background-color: #fbfbfd;
      color: #1d1d1f;
      letter-spacing: -0.01em;
    }

    /* 苹果风格棋盘网格 */
    .bg-checkerboard {
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      background-image:
        linear-gradient(45deg, #f2f2f7 25%, transparent 25%),
        linear-gradient(-45deg, #f2f2f7 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f2f2f7 75%),
        linear-gradient(-45deg, transparent 75%, #f2f2f7 75%);
    }

    /* 弥散柔和阴影 */
    .apple-shadow-sm {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02), 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .apple-shadow-md {
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.03), 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .apple-shadow-lg {
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.02);
    }

    /* 平滑过渡动画 */
    .apple-transition {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 隐藏数字输入框箭头 */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
    }

    /* 自定义苹果风格轻微滚动条 */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.12);
      border-radius: 99px;
    }

    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.25);
    }
  </style>
</head>

<body class="min-h-screen flex flex-col justify-between text-[#1d1d1f]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ================= 1. React Context 状态管理 =================
    const ConfigContext = React.createContext(null);

    const CONFIG_STORAGE_KEY = 'img_config_v1';
    const DEFAULT_CONFIG = {
      enableRemoveBg: true,
      enableRemoveWatermark: false,
      targetFormat: 'png',
      qualityType: 'preset',
      qualityPreset: '90',
      customQuality: '85',
      scaleType: 'preset',
      scalePreset: '100',
      customScalePercent: '80',
      customWidth: '',
      customHeight: '',
    };

    function loadConfigFromStorage() {
      try {
        const raw = localStorage.getItem(CONFIG_STORAGE_KEY);
        if (!raw) return { ...DEFAULT_CONFIG };
        const parsed = JSON.parse(raw);
        // 合并以保证新增的默认字段也存在
        return { ...DEFAULT_CONFIG, ...parsed };
      } catch (e) {
        console.warn('读取本地配置失败:', e);
        return { ...DEFAULT_CONFIG };
      }
    }

    function ConfigProvider({ children }) {
      const [config, setConfig] = useState(loadConfigFromStorage);

      // 配置变化时写入本地存储
      useEffect(() => {
        try {
          localStorage.setItem(CONFIG_STORAGE_KEY, JSON.stringify(config));
        } catch (e) {
          console.warn('写入本地配置失败:', e);
        }
      }, [config]);

      const setConfigValue = useCallback((key, value) => {
        setConfig(prev => ({ ...prev, [key]: value }));
      }, []);

      const toggleRemoveBg = useCallback(() => {
        setConfig(prev => ({ ...prev, enableRemoveBg: !prev.enableRemoveBg }));
      }, []);

      const toggleRemoveWatermark = useCallback(() => {
        setConfig(prev => ({ ...prev, enableRemoveWatermark: !prev.enableRemoveWatermark }));
      }, []);

      const value = { ...config, setConfig: setConfigValue, toggleRemoveBg, toggleRemoveWatermark };

      return <ConfigContext.Provider value={value}>{children}</ConfigContext.Provider>;
    }

    function useConfigStore() {
      const context = React.useContext(ConfigContext);
      if (!context) {
        throw new Error('useConfigStore must be used within ConfigProvider');
      }
      return context;
    }

    // Lucide Icon 苹果风格无损渲染封装
    const Icon = ({ name, className = "w-4 h-4" }) => {
      const spanRef = useRef(null);

      useEffect(() => {
        if (window.lucide && spanRef.current) {
          spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({ root: spanRef.current });
        }
      }, [name, className]);

      return <span ref={spanRef} className="inline-flex items-center justify-center pointer-events-none"></span>;
    };

    // 递归读取文件/文件夹
    const traverseFileTree = async (entry) => {
      return new Promise((resolve) => {
        if (entry.isFile) {
          entry.file((file) => {
            if (file && (file.type.startsWith('image/') || /\.(jpg|jpeg|png|webp|avif|bmp|ico|gif|svg)$/i.test(file.name))) {
              resolve([file]);
            } else {
              resolve([]);
            }
          }, () => resolve([]));
        } else if (entry.isDirectory) {
          const dirReader = entry.createReader();
          let allFiles = [];

          const readEntries = () => {
            dirReader.readEntries(async (entries) => {
              if (entries.length === 0) {
                resolve(allFiles);
              } else {
                const entryPromises = entries.map((e) => traverseFileTree(e));
                const results = await Promise.all(entryPromises);
                results.forEach((files) => { allFiles = allFiles.concat(files); });
                readEntries();
              }
            }, () => resolve(allFiles));
          };

          readEntries();
        } else {
          resolve([]);
        }
      });
    };

    // ================= 2. 主页面应用组件 =================
    function App() {
      const config = useConfigStore();
      const setConfig = config.setConfig;

      const [fileList, setFileList] = useState([]);
      const [isDragging, setIsDragging] = useState(false);
      const [isProcessing, setIsProcessing] = useState(false);
      const fileInputRef = useRef(null);
      const folderInputRef = useRef(null);
      const dragCounter = useRef(0);

      // 控制进度弹框显隐及本次渲染任务集合
      const [showProgressModal, setShowProgressModal] = useState(false);
      const [currentTaskIds, setCurrentTaskIds] = useState([]);
      const [currentClientId, setCurrentClientId] = useState('');
      const [progressInfo, setProgressInfo] = useState({ current: 0, total: 0, message: '' });
      const isStoppedRef = useRef(false);

      const formatList = [
        { label: 'PNG', value: 'png' },
        { label: 'JPEG', value: 'jpg' },
        { label: 'WEBP', value: 'webp' },
        { label: 'AVIF', value: 'avif' },
        { label: 'HEIC', value: 'heic' },
      ];

      const formatFileSize = (bytes) => {
        if (!bytes || bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
      };

      const handleAddFiles = useCallback((newFiles) => {
        const validImages = Array.from(newFiles).filter((f) =>
          f.type.startsWith('image/') || /\.(jpg|jpeg|png|webp|avif|bmp|ico|gif|svg|heic)$/i.test(f.name)
        );
        if (validImages.length === 0) return;

        const newItems = validImages.map((file) => ({
          id: Math.random().toString(36).substr(2, 9) + '-' + Date.now(),
          file: file,
          originalPreview: URL.createObjectURL(file),
          processedUrl: null,
          status: 'waiting',
          errorMessage: '',
        }));

        setFileList((prev) => [...prev, ...newItems]);
      }, []);

      useEffect(() => {
        const handleDragEnter = (e) => {
          e.preventDefault();
          dragCounter.current++;
          if (e.dataTransfer.items && e.dataTransfer.items.length > 0) setIsDragging(true);
        };

        const handleDragLeave = (e) => {
          e.preventDefault();
          dragCounter.current--;
          if (dragCounter.current === 0) setIsDragging(false);
        };

        const handleDragOver = (e) => e.preventDefault();

        const handleDrop = async (e) => {
          e.preventDefault();
          setIsDragging(false);
          dragCounter.current = 0;

          const items = e.dataTransfer.items;
          if (items && items.length > 0) {
            const entryPromises = [];
            for (let i = 0; i < items.length; i++) {
              const item = items[i];
              if (item.webkitGetAsEntry) {
                const entry = item.webkitGetAsEntry();
                if (entry) entryPromises.push(traverseFileTree(entry));
              }
            }

            if (entryPromises.length > 0) {
              const results = await Promise.all(entryPromises);
              const extractedFiles = results.flat();
              if (extractedFiles.length > 0) {
                handleAddFiles(extractedFiles);
                return;
              }
            }
          }

          if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            handleAddFiles(e.dataTransfer.files);
          }
        };

        window.addEventListener('dragenter', handleDragEnter);
        window.addEventListener('dragleave', handleDragLeave);
        window.addEventListener('dragover', handleDragOver);
        window.addEventListener('drop', handleDrop);

        return () => {
          window.removeEventListener('dragenter', handleDragEnter);
          window.removeEventListener('dragleave', handleDragLeave);
          window.removeEventListener('dragover', handleDragOver);
          window.removeEventListener('drop', handleDrop);
        };
      }, [handleAddFiles]);

      const handleFileSelect = (e) => {
        if (e.target.files && e.target.files.length > 0) {
          handleAddFiles(e.target.files);
          e.target.value = '';
        }
      };

      const handleRemoveItem = (id) => {
        setFileList((prev) => {
          const target = prev.find((item) => item.id === id);
          if (target && target.originalPreview) URL.revokeObjectURL(target.originalPreview);
          return prev.filter((item) => item.id !== id);
        });
      };

      const handleClearAll = () => {
        fileList.forEach((item) => {
          if (item.originalPreview) URL.revokeObjectURL(item.originalPreview);
        });
        setFileList([]);
      };

      const getFinalQuality = () => {
        if (config.qualityType === 'custom') {
          const num = parseInt(config.customQuality, 10);
          if (isNaN(num)) return '90';
          return Math.max(1, Math.min(100, num)).toString();
        }
        return config.qualityPreset;
      };

      const getFinalScale = () => {
        if (config.scaleType === 'custom_percent') {
          const num = parseInt(config.customScalePercent, 10);
          if (isNaN(num)) return '100';
          return Math.max(1, Math.min(500, num)).toString();
        } else if (config.scaleType === 'custom_px') {
          const w = config.customWidth.trim();
          const h = config.customHeight.trim();
          if (w || h) return `${w || 'auto'}x${h || 'auto'}`;
          return '100';
        }
        return config.scalePreset;
      };

      const handleStartBatchProcess = async () => {
        const waitingItems = fileList.filter(
          (item) => item.status === 'waiting' || item.status === 'error' || item.status === 'done',
        );
        if (waitingItems.length === 0) return;

        const ids = waitingItems.map((i) => i.id);
        setCurrentTaskIds(ids);
        setShowProgressModal(true);
        setIsProcessing(true);
        isStoppedRef.current = false;

        const clientId = 'client_' + Date.now();
        setCurrentClientId(clientId);

        const eventSource = new EventSource(`/api/progress?clientId=${clientId}`);
        eventSource.onmessage = (event) => {
          // 如果已停止，不再更新状态
          if (isStoppedRef.current) {
            return;
          }
          try {
            const data = JSON.parse(event.data);
            setProgressInfo({ current: data.current, total: data.total, message: data.message });

            // 根据后端进度同步更新任务状态
            // current 从 0 开始，表示正在处理第 current+1 张
            // current=0 时没有任务完成，current=1 时第 1 张完成
            if (data.current > 0 && waitingItems.length > 0) {
              const completedIds = waitingItems.slice(0, data.current).map(item => item.id);
              const currentId = waitingItems[data.current]?.id;

              setFileList(prev => prev.map(item => {
                if (completedIds.includes(item.id)) {
                  return { ...item, status: 'done' };
                }
                if (item.id === currentId && item.status !== 'done') {
                  return { ...item, status: 'processing' };
                }
                return item;
              }));
            }
          } catch (e) {
            console.error('进度解析异常:', e);
          }
        };
        eventSource.onerror = () => eventSource.close();

        const waitingIds = new Set(ids);
        setFileList((prev) =>
          prev.map((item) =>
            waitingIds.has(item.id) ? { ...item, status: 'processing', errorMessage: '' } : item,
          ),
        );

        const formData = new FormData();
        waitingItems.forEach((item) => formData.append('images', item.file));
        formData.append('removeBg', config.enableRemoveBg ? 'true' : 'false');
        formData.append('removeWatermark', config.enableRemoveWatermark ? 'true' : 'false');
        formData.append('format', config.targetFormat);
        formData.append('quality', getFinalQuality());
        formData.append('scale', getFinalScale());
        formData.append('clientId', clientId);

        try {
          const response = await fetch('/api/remove-bg-batch', {
            method: 'POST',
            body: formData,
          });

          // 如果已停止，不再执行下载和更新状态
          if (isStoppedRef.current) {
            eventSource.close();
            return;
          }

          const contentType = response.headers.get('content-type') || '';

          if (contentType.includes('application/zip')) {
            const processedCount = parseInt(response.headers.get('x-processed-count')) || waitingItems.length;
            const blob = await response.blob();
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `Processed_Images_${processedCount}.zip`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(downloadUrl);

            if (!isStoppedRef.current) {
              setFileList((prev) => prev.map((item) => waitingIds.has(item.id) ? { ...item, status: 'done' } : item));
            }
          } else if (contentType.startsWith('image/')) {
            const blob = await response.blob();
            const previewUrl = URL.createObjectURL(blob);

            const fileName = `${waitingItems[0].file.name.substring(0, waitingItems[0].file.name.lastIndexOf('.')) || waitingItems[0].file.name}_processed.${config.targetFormat}`;
            const a = document.createElement('a');
            a.href = previewUrl;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();

            if (!isStoppedRef.current) {
              setFileList((prev) =>
                prev.map((item) => waitingIds.has(item.id) ? { ...item, processedUrl: previewUrl, status: 'done' } : item),
              );
            }
          } else if (!response.ok) {
            if (!isStoppedRef.current) {
              const errMsg = `服务器错误: ${response.status}`;
              setFileList((prev) =>
                prev.map((item) => waitingIds.has(item.id) ? { ...item, status: 'error', errorMessage: errMsg } : item),
              );
            }
          } else {
            if (!isStoppedRef.current) {
              const errMsg = '服务器返回了无效响应';
              setFileList((prev) =>
                prev.map((item) => waitingIds.has(item.id) ? { ...item, status: 'error', errorMessage: errMsg } : item),
              );
            }
          }
        } catch (err) {
          // 如果已停止，不更新状态
          if (!isStoppedRef.current) {
            console.error('连接服务异常:', err);
            setFileList((prev) =>
              prev.map((item) => waitingIds.has(item.id) ? { ...item, status: 'error', errorMessage: '服务器未能响应' } : item),
            );
          }
        } finally {
          eventSource.close();
          setIsProcessing(false);
        }
      };

      const handleDownloadAllZipFrontend = async () => {
        const zip = new JSZip();
        const tasks = [];

        fileList.forEach((item) => {
          if (item.processedUrl) {
            const fileName = `${item.file.name.substring(0, item.file.name.lastIndexOf('.')) || item.file.name}_processed.${config.targetFormat}`;
            tasks.push(
              fetch(item.processedUrl)
                .then((r) => r.blob())
                .then((blob) => zip.file(fileName, blob))
            );
          }
        });

        if (tasks.length > 0) {
          await Promise.all(tasks);
          const content = await zip.generateAsync({ type: 'blob' });
          if (window.saveAs) {
            window.saveAs(content, `Export_Images_${tasks.length}.zip`);
          }
        }
      };

      const totalCount = fileList.length;
      const doneCount = fileList.filter((i) => i.status === 'done').length;

      // 模态框计算逻辑
      const modalTasks = fileList.filter((item) => currentTaskIds.includes(item.id));
      const isAllTasksCompleted = modalTasks.length > 0 && modalTasks.every((t) => t.status === 'done' || t.status === 'error');
      const isAllTasksSuccess = modalTasks.length > 0 && modalTasks.every((t) => t.status === 'done');
      const successTasksCount = modalTasks.filter((t) => t.status === 'done').length;

      return (
        <div className="min-h-screen flex flex-col justify-between selection:bg-[#0071e3] selection:text-white">
          <div>
            {/* 顶栏苹果风格毛玻璃 Navigation */}
            <header className="sticky top-0 z-40 w-full backdrop-blur-md bg-white/70 border-b border-black/[0.05] apple-transition">
              <div className="max-w-[1200px] mx-auto px-6 h-12 flex items-center justify-between font-normal">
                <div className="flex items-center gap-2 tracking-tight">
                  <span className="font-semibold text-sm tracking-tight text-black">Studio</span>
                  <span className="text-black/30">|</span>
                  <span className="text-black/60">智能图像轻处理系统</span>
                </div>
                <div className="flex items-center gap-6">
                  <a href="http://www.mx2d.cn" target="_blank" rel="noopener noreferrer" className="text-black/60 hover:text-black apple-transition">
                    技术支持
                  </a>
                </div>
              </div>
            </header>

            {/* Apple 经典 Hero Banner 区域 */}
            <section className="pt-16 pb-12 px-6 text-center max-w-[1200px] mx-auto mt-4 rounded-2xl " style={{ backgroundImage: 'url(./header.webp)', backgroundSize: 'cover', backgroundPosition: 'center', backgroundRepeat: 'no-repeat', }}>
              <h1 className="text-4xl sm:text-5xl font-semibold tracking-tight text-white mb-3">
                吴文龙的图片处理
              </h1>
              <p className="text-lg sm:text-xl font-normal text-gray-300 leading-relaxed max-w-[560px] mx-auto">
                结合本地神经网络计算，实现像素级轮廓剪裁与自动化批处理。
              </p>
            </section>

            {/* 主操作台区域 */}
            <main className="max-w-[1200px] mx-auto px-6 space-y-8 pb-16">

              {/* 拖拽 Modal Overlay */}
              <div
                className={`fixed inset-0 bg-black/20 backdrop-blur-xl z-50 flex flex-col items-center justify-center apple-transition ${isDragging ? 'opacity-100 pointer-events-auto scale-100' : 'opacity-0 pointer-events-none scale-98'}`}
              >
                <div className="w-20 h-20 rounded-full bg-white/80 shadow-2xl flex items-center justify-center mb-6">
                  <Icon name="arrow-down" className="w-8 h-8 text-[#0071e3]" />
                </div>
                <p className="text-2xl font-medium tracking-tight text-[#1d1d1f]">释放以导入图像</p>
                <p className="text-[#86868b] text-sm mt-1">支持批量拖入图像文件或层级文件夹</p>
              </div>

              {/* 1. 参数调优区域 */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

                {/* 抠图 & 去水印集成卡片 */}
                <div className="bg-white rounded-2xl p-5 border border-black/[0.03] apple-shadow-sm hover:apple-shadow-md apple-transition flex flex-col justify-between">
                  <div>
                    <div className=" font-medium text-[#86868b] uppercase tracking-wider mb-3">智能擦除</div>
                    <div className="space-y-2.5">
                      <div
                        onClick={config.toggleRemoveBg}
                        className={`flex items-center justify-between p-2.5 rounded-xl cursor-pointer apple-transition ${config.enableRemoveBg ? 'bg-[#f5f5f7]' : 'hover:bg-[#f5f5f7]/50'}`}
                      >
                        <span className="text-sm font-medium text-[#1d1d1f]">去背景</span>
                        <div className={`w-5 h-5 rounded-full flex items-center justify-center apple-transition ${config.enableRemoveBg ? 'bg-[#0071e3] text-white' : 'border border-[#d2d2d7]'}`}>
                          {config.enableRemoveBg && <Icon name="check" className="w-3 h-3 stroke-[2.5]" />}
                        </div>
                      </div>

                      <div
                        onClick={config.toggleRemoveWatermark}
                        className={`flex items-center justify-between p-2.5 rounded-xl cursor-pointer apple-transition ${config.enableRemoveWatermark ? 'bg-[#f5f5f7]' : 'hover:bg-[#f5f5f7]/50'}`}
                      >
                        <span className="text-sm font-medium text-[#1d1d1f]">去豆包水印</span>
                        <div className={`w-5 h-5 rounded-full flex items-center justify-center apple-transition ${config.enableRemoveWatermark ? 'bg-[#0071e3] text-white' : 'border border-[#d2d2d7]'}`}>
                          {config.enableRemoveWatermark && <Icon name="check" className="w-3 h-3 stroke-[2.5]" />}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* 格式选择 */}
                <div className="bg-white rounded-2xl p-5 border border-black/[0.03] apple-shadow-sm hover:apple-shadow-md apple-transition flex flex-col justify-between">
                  <div>
                    <div className=" font-medium text-[#86868b] uppercase tracking-wider mb-3">导出格式</div>
                    <div className="grid grid-cols-3 gap-1.5 p-1 bg-[#f5f5f7] rounded-xl">
                      {formatList.map((item) => {
                        const isSelected = config.targetFormat === item.value;
                        return (
                          <button
                            key={item.value}
                            onClick={() => setConfig('targetFormat', item.value)}
                            className={`py-1.5 rounded-lg  font-medium apple-transition ${isSelected ? 'bg-white text-[#1d1d1f] apple-shadow-sm' : 'text-[#86868b] hover:text-[#1d1d1f]'}`}
                          >
                            {item.label}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>

                {/* 图像质量 */}
                <div className="bg-white rounded-2xl p-5 border border-black/[0.03] apple-shadow-sm hover:apple-shadow-md apple-transition flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between mb-3">
                      <span className=" font-medium text-[#86868b] uppercase tracking-wider">图片压缩</span>
                      <div className="flex gap-1">
                        <button
                          onClick={() => setConfig('qualityType', 'preset')}
                          className={` px-2 py-0.5 rounded-md apple-transition ${config.qualityType === 'preset' ? 'bg-[#f5f5f7] text-[#1d1d1f] font-medium' : 'text-[#86868b]'}`}
                        >
                          预设
                        </button>
                        <button
                          onClick={() => setConfig('qualityType', 'custom')}
                          className={` px-2 py-0.5 rounded-md apple-transition ${config.qualityType === 'custom' ? 'bg-[#f5f5f7] text-[#1d1d1f] font-medium' : 'text-[#86868b]'}`}
                        >
                          精准
                        </button>
                      </div>
                    </div>

                    {config.qualityType === 'preset' ? (
                      <div className="grid grid-cols-3 gap-1.5 p-1 bg-[#f5f5f7] rounded-xl">
                        {[
                          { label: '原品质', value: '100' },
                          { label: '高质量', value: '90' },
                          { label: '均衡', value: '75' },
                        ].map((item) => (
                          <button
                            key={item.value}
                            onClick={() => setConfig('qualityPreset', item.value)}
                            className={`py-1.5 rounded-lg  font-medium apple-transition ${config.qualityPreset === item.value ? 'bg-white text-[#1d1d1f] apple-shadow-sm' : 'text-[#86868b] hover:text-[#1d1d1f]'}`}
                          >
                            {item.label}
                          </button>
                        ))}
                      </div>
                    ) : (
                      <div className="relative">
                        <input
                          type="number"
                          min="1"
                          max="100"
                          value={config.customQuality}
                          onChange={(e) => setConfig('customQuality', e.target.value)}
                          placeholder="85"
                          className="w-full bg-[#f5f5f7] border-0 rounded-xl px-3 py-1.5  font-medium text-[#1d1d1f] focus:ring-1 focus:ring-[#0071e3] outline-none"
                        />
                        <span className="absolute right-3 top-1.5  text-[#86868b]">%</span>
                      </div>
                    )}
                  </div>
                </div>

                {/* 尺寸调节 */}
                <div className="bg-white rounded-2xl p-5 border border-black/[0.03] apple-shadow-sm hover:apple-shadow-md apple-transition flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between mb-3">
                      <span className=" font-medium text-[#86868b] uppercase tracking-wider">图片缩放</span>
                      <div className="flex gap-1">
                        <button
                          onClick={() => setConfig('scaleType', 'preset')}
                          className={` px-2 py-0.5 rounded-md apple-transition ${config.scaleType === 'preset' ? 'bg-[#f5f5f7] text-[#1d1d1f] font-medium' : 'text-[#86868b]'}`}
                        >
                          比例
                        </button>
                        <button
                          onClick={() => setConfig('scaleType', 'custom_px')}
                          className={` px-2 py-0.5 rounded-md apple-transition ${config.scaleType === 'custom_px' ? 'bg-[#f5f5f7] text-[#1d1d1f] font-medium' : 'text-[#86868b]'}`}
                        >
                          像素
                        </button>
                      </div>
                    </div>

                    {config.scaleType === 'preset' ? (
                      <div className="grid grid-cols-3 gap-1.5 p-1 bg-[#f5f5f7] rounded-xl">
                        {[
                          { label: '100%', value: '100' },
                          { label: '75%', value: '75' },
                          { label: '50%', value: '50' },
                        ].map((item) => (
                          <button
                            key={item.value}
                            onClick={() => setConfig('scalePreset', item.value)}
                            className={`py-1.5 rounded-lg  font-medium apple-transition ${config.scalePreset === item.value ? 'bg-white text-[#1d1d1f] apple-shadow-sm' : 'text-[#86868b] hover:text-[#1d1d1f]'}`}
                          >
                            {item.label}
                          </button>
                        ))}
                      </div>
                    ) : (
                      <div className="flex items-center gap-2">
                        <input
                          type="number"
                          value={config.customWidth}
                          onChange={(e) => setConfig('customWidth', e.target.value)}
                          placeholder="宽度"
                          className="w-1/2 bg-[#f5f5f7] border-0 rounded-xl px-2.5 py-1.5  font-medium text-[#1d1d1f] focus:ring-1 focus:ring-[#0071e3] outline-none"
                        />
                        <span className="text-[#86868b] ">×</span>
                        <input
                          type="number"
                          value={config.customHeight}
                          onChange={(e) => setConfig('customHeight', e.target.value)}
                          placeholder="高度"
                          className="w-1/2 bg-[#f5f5f7] border-0 rounded-xl px-2.5 py-1.5  font-medium text-[#1d1d1f] focus:ring-1 focus:ring-[#0071e3] outline-none"
                        />
                      </div>
                    )}
                  </div>
                </div>

              </div>

              {/* 2. 操作动作条 */}
              <div className="bg-white rounded-2xl p-4 border border-black/[0.03] apple-shadow-sm flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <button
                    onClick={() => fileInputRef.current && fileInputRef.current.click()}
                    className="bg-[#0071e3] hover:bg-[#0077ed] text-white  font-medium px-4 py-2 rounded-full apple-transition flex items-center gap-1.5 shadow-sm active:scale-98"
                  >
                    <Icon name="plus" className="w-3.5 h-3.5" />
                    <span>选择图像</span>
                  </button>
                  <input
                    type="file"
                    ref={fileInputRef}
                    onChange={handleFileSelect}
                    multiple
                    accept="image/*"
                    className="hidden"
                  />

                  <button
                    onClick={() => folderInputRef.current && folderInputRef.current.click()}
                    className="bg-[#f5f5f7] hover:bg-[#e8e8ed] text-[#1d1d1f]  font-medium px-4 py-2 rounded-full apple-transition flex items-center gap-1.5 active:scale-98"
                  >
                    <Icon name="folder" className="w-3.5 h-3.5 text-[#86868b]" />
                    <span>选择文件夹</span>
                  </button>
                  <input
                    type="file"
                    ref={folderInputRef}
                    onChange={handleFileSelect}
                    webkitdirectory="true"
                    directory="true"
                    multiple
                    className="hidden"
                  />

                  {totalCount > 0 && (
                    <span className=" text-[#86868b] ml-2">
                      已选中 <span className="text-[#1d1d1f] font-medium">{totalCount}</span> 项
                    </span>
                  )}
                </div>

                <div className="flex items-center gap-3">
                  {totalCount > 0 && (
                    <button
                      onClick={handleClearAll}
                      className=" text-[#86868b] hover:text-[#ff3b30] px-3 py-1.5 rounded-lg apple-transition"
                    >
                      移除全部
                    </button>
                  )}

                  {fileList.length > 0 && !isProcessing && (
                    <button
                      onClick={handleStartBatchProcess}
                      className="bg-[#1d1d1f] hover:bg-black text-white font-medium px-5 py-2 rounded-full apple-transition flex items-center gap-2 shadow-sm active:scale-98"
                    >
                      <span>开始渲染</span>
                    </button>
                  )}

                  {isProcessing && (
                    <button
                      disabled
                      className="bg-[#1d1d1f] text-white font-medium px-5 py-2 rounded-full apple-transition flex items-center gap-2 cursor-not-allowed"
                    >
                      <Icon name="loader-2" className="w-3.5 h-3.5 animate-spin" />
                      <span>处理中...</span>
                    </button>
                  )}
                </div>
              </div>

              {/* 3. 图像内容主展示区 */}
              {fileList.length === 0 ? (
                <div
                  onClick={() => fileInputRef.current && fileInputRef.current.click()}
                  className="border border-dashed border-[#d2d2d7] rounded-3xl bg-white/50 hover:bg-white hover:border-[#86868b] apple-transition p-16 text-center cursor-pointer flex flex-col items-center justify-center min-h-[360px]"
                >
                  <div className="w-14 h-14 rounded-full bg-[#f5f5f7] flex items-center justify-center mb-4">
                    <Icon name="image" className="w-6 h-6 text-[#86868b]" />
                  </div>
                  <p className="text-base font-medium text-[#1d1d1f] mb-1">点按或拖拽项目至此</p>
                  <p className=" text-[#86868b]">支持单个文件、多图选择或完整目录拖入</p>
                </div>
              ) : (
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                  {fileList.map((item) => (
                    <ImageCard
                      key={item.id}
                      item={item}
                      onRemove={handleRemoveItem}
                      formatFileSize={formatFileSize}
                      targetFormat={config.targetFormat}
                    />
                  ))}
                </div>
              )}

            </main>
          </div>

          {/* 4. 渲染进度列表模态框 Modal */}
          {showProgressModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              {/* 背景遮罩 - 未完全成功前禁止通过点击背景关闭 */}
              <div
                className="absolute inset-0 bg-black/25 backdrop-blur-md apple-transition"
                onClick={() => {
                  if (isAllTasksSuccess) setShowProgressModal(false);
                }}
              />

              <div className="relative bg-white/95 backdrop-blur-2xl rounded-3xl p-6 max-w-4xl w-full text-left apple-shadow-lg border border-black/[0.04] flex flex-col max-h-[85vh] z-10 apple-transition">

                {/* 标题栏 */}
                <div className="flex items-center justify-between pb-4 border-b border-black/[0.05]">
                  <div>
                    <h3 className="text-lg font-semibold text-[#1d1d1f]">
                      {isAllTasksCompleted
                        ? (isAllTasksSuccess ? '渲染完成' : '处理结束 (含失败)')
                        : '图像渲染中...'}
                    </h3>
                    <p className="text-xs text-[#86868b] mt-0.5">
                      {isAllTasksSuccess
                        ? `所有 ${modalTasks.length} 个文件均已成功处理完毕`
                        : `包含 ${modalTasks.length} 个任务，正实时协同运算`}
                    </p>
                  </div>

                  {/* 右上角关闭/停止/返回按钮 */}
                  {isProcessing ? (
                    <button
                      onClick={async () => {
                        try {
                          await fetch('/api/stop-render', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ clientId: currentClientId }),
                          });
                          // 标记已停止
                          isStoppedRef.current = true;
                          // 停止后更新任务状态为 error
                          setFileList(prev => prev.map(item => {
                            if (currentTaskIds.includes(item.id)) {
                              return { ...item, status: 'error', errorMessage: '用户手动停止' };
                            }
                            return item;
                          }));
                          setIsProcessing(false);
                        } catch (e) {
                          console.error('停止失败:', e);
                        }
                      }}
                      className="w-14 h-7 rounded-full flex items-center justify-center apple-transition bg-red-500 hover:bg-red-600 text-white text-xs font-medium cursor-pointer"
                      title="停止渲染"
                    >
                      停止
                    </button>
                  ) : (
                    <button
                      onClick={() => setShowProgressModal(false)}
                      disabled={!isAllTasksSuccess && !isStoppedRef.current}
                      className={`w-14 h-7 rounded-full flex items-center justify-center apple-transition text-xs font-medium ${isAllTasksSuccess || isStoppedRef.current
                        ? 'bg-[#f5f5f7] hover:bg-[#e8e8ed] text-[#1d1d1f] cursor-pointer'
                        : 'bg-[#f5f5f7]/50 text-[#c7c7cc] cursor-not-allowed'
                        }`}
                      title={isAllTasksSuccess ? '关闭' : isStoppedRef.current ? '返回' : '处理完成后方可关闭'}
                    >
                      {isStoppedRef.current ? '返回' : isAllTasksSuccess ? '关闭' : '等待中'}
                    </button>
                  )}
                </div>

                {/* 全局进度条 (动态) */}
                <div className="py-4 border-b border-black/[0.05]">
                  <div className="flex justify-between items-center text-xs mb-1.5">
                    <span className="text-[#86868b] truncate max-w-[240px]">
                      {progressInfo.message || (isAllTasksCompleted ? '处理已结束' : '正在准备任务队列...')}
                    </span>
                    <span className="font-medium text-[#1d1d1f] ml-2">
                      {progressInfo.total > 0 ? progressInfo.current : 0} / {progressInfo.total > 0 ? progressInfo.total : modalTasks.length}
                    </span>
                  </div>
                  <div className="h-1.5 w-full bg-[#f5f5f7] rounded-full overflow-hidden">
                    <div
                      className="h-full bg-[#0071e3] apple-transition duration-300"
                      style={{
                        width: `${progressInfo.total > 0 ? (progressInfo.current / progressInfo.total) * 100 : 0}%`,
                      }}
                    />
                  </div>
                </div>

                {/* 渲染图片明细列表 */}
                <div className="flex-1 overflow-y-auto custom-scroll my-3 pr-1 space-y-2 min-h-[160px] max-h-[300px]">
                  {modalTasks.map((task) => (
                    <div
                      key={task.id}
                      className="flex items-center justify-between p-2.5 rounded-xl bg-[#f5f5f7]/60 hover:bg-[#f5f5f7] apple-transition text-xs"
                    >
                      {/* 左侧：文件名 */}
                      <div className="flex items-center gap-2 truncate mr-3">
                        <Icon name="file-image" className="w-4 h-4 text-[#86868b] flex-shrink-0" />
                        <span className="font-medium text-[#1d1d1f] truncate" title={task.file.name}>
                          {task.file.name}
                        </span>
                      </div>

                      {/* 右侧：状态指示 */}
                      <div className="flex-shrink-0 flex items-center gap-1.5">
                        {task.status === 'waiting' && (
                          <span className="px-2 py-0.5 rounded-full text-[10px] font-medium bg-[#1d1d1f]/5 text-[#86868b]">
                            等待中
                          </span>
                        )}
                        {task.status === 'processing' && (
                          <span className="px-2 py-0.5 rounded-full text-[10px] font-medium bg-[#0071e3]/10 text-[#0071e3] flex items-center gap-1">
                            <Icon name="loader-2" className="w-3 h-3 animate-spin" />
                            处理中
                          </span>
                        )}
                        {task.status === 'done' && (
                          <span className="px-2 py-0.5 rounded-full text-[10px] font-medium bg-[#34c759]/10 text-[#34c759] flex items-center gap-1">
                            <Icon name="check" className="w-3 h-3" />
                            成功
                          </span>
                        )}
                        {task.status === 'error' && (
                          <span className="px-2 py-0.5 rounded-full text-[10px] font-medium bg-[#ff3b30]/10 text-[#ff3b30] flex items-center gap-1" title={task.errorMessage}>
                            <Icon name="alert-circle" className="w-3 h-3" />
                            失败
                          </span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>

                {/* 底部按钮区域 */}
                <div className="pt-3 border-t border-black/[0.05]">
                  <button
                    onClick={() => setShowProgressModal(false)}
                    disabled={!isAllTasksSuccess}
                    className={`w-full py-2.5 rounded-xl font-medium text-sm apple-transition ${isAllTasksSuccess
                      ? 'bg-[#0071e3] hover:bg-[#0077ed] text-white shadow-sm cursor-pointer'
                      : 'bg-[#f5f5f7] text-[#c7c7cc] cursor-not-allowed'
                      }`}
                  >
                    {isAllTasksSuccess ? '完成' : '处理中，请稍候...'}
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* 页脚 Footer */}
          <footer className="w-full py-8 border-t border-black/[0.05] bg-white text-center text-[#86868b]">
            <div className="max-w-[1200px] mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-2">
              <div>Copyright © {new Date().getFullYear()} Studio. All rights reserved.</div>
              <a
                href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=44011202003613"
                target="_blank"
                rel="noopener noreferrer"
                className="hover:text-[#1d1d1f] apple-transition"
              >
                粤公网安备 44011202003613 号
              </a>
            </div>
          </footer>
        </div>
      );
    }

    // ================= 3. ImageCard 子组件 =================
    function ImageCard({ item, onRemove, formatFileSize, targetFormat }) {
      const { file, originalPreview, processedUrl, status, errorMessage } = item;
      const displayImg = processedUrl || originalPreview;

      const downloadName = `${file.name.substring(0, file.name.lastIndexOf('.')) || file.name}_processed.${targetFormat}`;

      return (
        <div className="bg-white rounded-2xl overflow-hidden border border-black/[0.03] apple-shadow-sm hover:apple-shadow-md apple-transition flex flex-col group relative">

          {/* 状态指示极简 Badge */}
          <div className="absolute top-2.5 left-2.5 z-10">
            {status === 'waiting' && (
              <span className="px-2 py-0.5 rounded-full text-[10px] font-medium bg-black/5 backdrop-blur-md text-[#1d1d1f]">就绪</span>
            )}
            {status === 'processing' && (
              <span className="px-2 py-0.5 rounded-full text-[10px] font-medium bg-[#0071e3]/10 backdrop-blur-md text-[#0071e3] flex items-center gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-[#0071e3] animate-pulse"></span>
                计算中
              </span>
            )}
            {status === 'done' && (
              <span className="px-2 py-0.5 rounded-full text-[10px] font-medium bg-[#34c759]/10 backdrop-blur-md text-[#34c759]">完成</span>
            )}
            {status === 'error' && (
              <span className="px-2 py-0.5 rounded-full text-[10px] font-medium bg-[#ff3b30]/10 backdrop-blur-md text-[#ff3b30]" title={errorMessage}>异常</span>
            )}
          </div>

          {/* 移除按钮 */}
          {status !== 'processing' && (
            <button
              onClick={() => onRemove(item.id)}
              className="absolute top-2.5 right-2.5 z-10 w-6 h-6 rounded-full bg-white/80 backdrop-blur-md text-[#86868b] hover:text-[#ff3b30] flex items-center justify-center opacity-0 group-hover:opacity-100 apple-transition apple-shadow-sm"
            >
              <Icon name="x" className="w-3.5 h-3.5" />
            </button>
          )}

          {/* 图像预览区 */}
          <div className={`h-48 relative flex items-center justify-center p-3 ${processedUrl ? 'bg-checkerboard' : 'bg-[#f5f5f7]/60'}`}>
            <img
              src={displayImg}
              alt={file.name}
              className="max-h-full max-w-full object-contain apple-transition group-hover:scale-102"
            />
          </div>

          {/* 底部详情 */}
          <div className="p-3 bg-white flex flex-col justify-between flex-1 space-y-2">
            <div>
              <div className=" font-medium text-[#1d1d1f] truncate" title={file.name}>
                {file.name}
              </div>
              <div className="text-[11px] text-[#86868b] mt-0.5">
                {formatFileSize(file.size)}
              </div>
            </div>

            {processedUrl && (
              <a
                href={processedUrl}
                download={downloadName}
                className="w-full bg-[#f5f5f7] hover:bg-[#0071e3] text-[#1d1d1f] hover:text-white rounded-xl py-1.5  font-medium apple-transition flex items-center justify-center gap-1 mt-1"
              >
                <Icon name="arrow-down" className="w-3 h-3" />
                <span>保存</span>
              </a>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ConfigProvider><App /></ConfigProvider>);
  </script>
</body>

</html>
